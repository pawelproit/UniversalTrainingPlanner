<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Universal Training Planner</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <nav>
            <a href="#home">Home</a>
            <a href="#strength" class="auth-only">Strength Training</a>
            <a href="#cardio" class="auth-only">Cardio</a>
            <a href="#flexibility" class="auth-only">Flexibility</a>
            <a href="#" id="logout-btn" class="auth-only" style="background-color: #f44336;">Logout</a>
        </nav>
        <main>
            <div id="login-view" class="view active">
                <h1>Login / Register</h1>
                <form id="auth-form">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required>
                    <label for="password">Password:</label>
                    <input type="password" id="password" required>
                    <button type="submit" id="login-btn">Login</button>
                    <button type="button" id="register-btn" style="background-color: #2196F3; margin-top: 10px; width: 100%;">Register</button>
                </form>
                <p id="auth-error" style="color: red; margin-top: 15px; text-align: center;"></p>
            </div>

            <div id="home" class="view">
                <h1>Welcome to Universal Training Planner</h1>
                <p>Select a training type to plan your session.</p>
            </div>

            <div id="strength" class="view">
                <h1>Strength Training</h1>
                <form>
                    <label for="exercise">Exercise:</label>
                    <input type="text" id="exercise" name="exercise">
                    <label for="sets">Sets:</label>
                    <input type="number" id="sets" name="sets">
                    <label for="reps">Reps:</label>
                    <input type="number" id="reps" name="reps">
                    <label for="weight">Weight (lbs):</label>
                    <input type="number" id="weight" name="weight">
                    <button type="button">Add Exercise</button>
                </form>
            </div>

            <div id="cardio" class="view">
                <h1>Cardio</h1>
                <form>
                    <label for="activity">Activity:</label>
                    <input type="text" id="activity" name="activity">
                    <label for="duration">Duration (minutes):</label>
                    <input type="number" id="duration" name="duration">
                    <label for="distance">Distance (miles):</label>
                    <input type="number" id="distance" name="distance">
                    <label for="pace">Pace (min/mile):</label>
                    <input type="text" id="pace" name="pace">
                    <button type="button">Add Activity</button>
                </form>
            </div>

            <div id="flexibility" class="view">
                <h1>Flexibility</h1>
                <form>
                    <label for="pose">Pose:</label>
                    <input type="text" id="pose" name="pose">
                    <label for="hold-time">Hold Time (seconds):</label>
                    <input type="number" id="hold-time" name="hold-time">
                    <label for="repetitions">Repetitions:</label>
                    <input type="number" id="repetitions" name="repetitions">
                    <label for="difficulty">Difficulty:</label>
                    <select id="difficulty" name="difficulty">
                        <option value="beginner">Beginner</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="advanced">Advanced</option>
                    </select>
                    <button type="button">Add Pose</button>
                </form>
            </div>
        </main>
        <script type="module" src="main.js"></script>
    </body>
</html>
